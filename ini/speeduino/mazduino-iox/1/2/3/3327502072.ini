[UserDefined]
   dialog = out0Dialog, "Output LC1"
      topicHelp = "https://wiki.mazduino.com/can-io-extender/"
      field = "#Type"
      field = "Low side, low current: switches the load's ground."
      field = "For a ground signal to another device, or a relay coil. On/off, no PWM."
      field = "Wire the other end of the load to 12 V."
      field = "#Setup"
      field = "Name",            out0_name
      field = "Mode",            out0_mode
      field = "#Dash button"
      field = "Racedash CAN Button: ID 0x648 (1608), byte 0, ON value 1, OFF 0, toggle."
      field = "Node 1-3: ID 0x658 / 0x668 / 0x678, same byte and value."
      field = "#Condition 1"
      field = "Source",          out0_src1,  { out0_mode != 0 }
      field = "Comparison",      out0_cmp1,  { out0_mode != 0 && out0_src1 != 0 }
      field = "Target",          out0_tgt1,  { out0_mode != 0 && out0_src1 != 0 }
      field = "Hysteresis",      out0_hyst1, { out0_mode != 0 && out0_src1 != 0 && out0_cmp1 < 4 }
      field = "#Condition 2"
      field = "Combine with",    out0_logic, { out0_mode != 0 }
      field = "Source",          out0_src2,  { out0_mode != 0 && out0_logic != 0 }
      field = "Comparison",      out0_cmp2,  { out0_mode != 0 && out0_logic != 0 && out0_src2 != 0 }
