   out0_name = "Your name for LC1, for example Fan or Fuel pump. Stored in this TunerStudio project only."
   out0_mode = "Dash button: LC1 follows a Racedash CAN Button set to ID 0x648 (1608) on node 0, byte 0, ON value 1, OFF value 0, toggle on. It goes off 500 ms after the dash stops sending. Rule: the module switches LC1 by itself from the conditions below, with or without a dash. Dash button OR Rule: either one turns it on. Dash button AND Rule: the button only works while the rule is true, for example an arm switch that only works above a set temperature."
   out0_src1 = "What the condition watches. AV1-AV10 are calibrated values in the units of their curve, Raw AV in volts, Digital In 1-4 in rpm, km/h or Hz as set under Digital Inputs (1 while active for a Switch), SW1-SW4 are 1 when active, Battery in volts. LC1-LOGIC2 output is 1 while that output is on, so rules can be chained for more than two conditions."
   out0_tgt1 = "The value the source is compared against, in the source's own units."
   out0_hyst1 = "Keeps the output from chattering around the target. With > the output stays on until the source falls below Target minus Hysteresis; with < until it rises above Target plus Hysteresis. Example: fan on above 95, off below 90 = Target 95, Hysteresis 5."
   out0_logic = "Add a second condition. AND needs both, OR needs either, XOR needs exactly one."
   out0_delay = "How long the conditions must hold before LC1 turns on. It turns off without delay."
   out0_limit = "0 = no limit. Minimum on-time keeps LC1 on at least this long once it turns on, even if the conditions drop, for example a fan that runs at least 30 s. Maximum on-time turns it off after this long even if the conditions still hold, and re-arms when they drop, for example a 3 s fuel pump prime."
   out0_active = "Off when conditions are met inverts the rule: LC1 is on while the conditions are false, and off once they are met."
