   out6_delay = "How long the conditions must hold before LS2 turns on. It turns off without delay."
   out6_limit = "0 = no limit. Minimum on-time keeps LS2 on at least this long once it turns on, even if the conditions drop, for example a fan that runs at least 30 s. Maximum on-time turns it off after this long even if the conditions still hold, and re-arms when they drop, for example a 3 s fuel pump prime."
   out6_active = "Off when conditions are met inverts the rule: LS2 is on while the conditions are false, and off once they are met."
   out7_name = "Your name for HS1, for example Fan or Fuel pump. Stored in this TunerStudio project only."
   out7_mode = "Dash button: HS1 follows a Racedash CAN Button set to ID 0x648 (1608) on node 0, byte 1, ON value 1, OFF value 0, toggle on. It goes off 500 ms after the dash stops sending. Rule: the module switches HS1 by itself from the conditions below, with or without a dash. Dash button OR Rule: either one turns it on. Dash button AND Rule: the button only works while the rule is true, for example an arm switch that only works above a set temperature."
   out7_src1 = "What the condition watches. AV1-AV10 are calibrated values in the units of their curve, Raw AV in volts, Digital In 1-4 in rpm, km/h or Hz as set under Digital Inputs (1 while active for a Switch), SW1-SW4 are 1 when active, Battery in volts. LC1-LOGIC2 output is 1 while that output is on, so rules can be chained for more than two conditions."
   out7_tgt1 = "The value the source is compared against, in the source's own units."
   out7_hyst1 = "Keeps the output from chattering around the target. With > the output stays on until the source falls below Target minus Hysteresis; with < until it rises above Target plus Hysteresis. Example: fan on above 95, off below 90 = Target 95, Hysteresis 5."
   out7_logic = "Add a second condition. AND needs both, OR needs either, XOR needs exactly one."
   out7_delay = "How long the conditions must hold before HS1 turns on. It turns off without delay."
   out7_limit = "0 = no limit. Minimum on-time keeps HS1 on at least this long once it turns on, even if the conditions drop, for example a fan that runs at least 30 s. Maximum on-time turns it off after this long even if the conditions still hold, and re-arms when they drop, for example a 3 s fuel pump prime."
   out7_active = "Off when conditions are met inverts the rule: HS1 is on while the conditions are false, and off once they are met."
   hsPwmHz = "PWM frequency of HS1 and HS2. Both run on one hardware timer, so they always share this frequency. 4-500 Hz, 500 Hz maximum: the high-side driver switches slowly. Default 490 Hz."
   ls1PwmHz = "PWM frequency of LS1, made in software and independent of LS2. 4-500 Hz, 500 Hz maximum; boost and idle solenoids usually want 15-300 Hz. Pulses shorter than 0.1 ms round to off or fully on, so the usable duty narrows at high frequency (5-95% at 500 Hz). Default 100 Hz."
   ls2PwmHz = "PWM frequency of LS2, made in software and independent of LS1. 4-500 Hz, 500 Hz maximum; boost and idle solenoids usually want 15-300 Hz. Pulses shorter than 0.1 ms round to off or fully on, so the usable duty narrows at high frequency (5-95% at 500 Hz). Default 100 Hz."
   out5_duty = "PWM duty while the rule drives LS1, at the LS1 PWM frequency. 0 or 100% means fully on. A CAN Button command uses its own duty (byte 4)."
   out6_duty = "PWM duty while the rule drives LS2, at the LS2 PWM frequency. 0 or 100% means fully on. A CAN Button command uses its own duty (byte 5)."
