name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crystal: ['8mhz', '16mhz']
        node: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        env:
          PLATFORMIO_BUILD_FLAGS: -D NODE_ID=${{ matrix.node }}
        run: |
          env=megaatmega2560
          if [ "${{ matrix.crystal }}" = "16mhz" ]; then env=megaatmega2560-16mhz; fi
          pio run -e "$env"
          mkdir -p out
          cp ".pio/build/$env/firmware.hex" \
             "out/can-io-extender-${{ matrix.crystal }}-node${{ matrix.node }}.hex"

      - uses: actions/upload-artifact@v4
        with:
          name: can-io-extender-${{ matrix.crystal }}-node${{ matrix.node }}
          path: out/*.hex

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.hex
            flash.bat
            flash.sh
          generate_release_notes: true
