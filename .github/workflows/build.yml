name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crystal: ['8mhz', '16mhz']
        node: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        env:
          PLATFORMIO_BUILD_FLAGS: -D NODE_ID=${{ matrix.node }}
        run: |
          env=megaatmega2560
          if [ "${{ matrix.crystal }}" = "16mhz" ]; then env=megaatmega2560-16mhz; fi
          pio run -e "$env"
          mkdir -p out
          name="can-io-extender-${{ matrix.crystal }}-node${{ matrix.node }}"
          cp ".pio/build/$env/firmware.hex" "out/$name.hex"
          ~/.platformio/packages/toolchain-atmelavr/bin/avr-objcopy \
            -I ihex -O binary "out/$name.hex" "out/$name.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: can-io-extender-${{ matrix.crystal }}-node${{ matrix.node }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Zip
        run: |
          pkg="can-io-extender-${GITHUB_REF_NAME}"
          mkdir -p "$pkg/hex" "$pkg/bin" "$pkg/tunerstudio"
          cp out/*.hex "$pkg/hex/"
          cp out/*.bin "$pkg/bin/"
          cp tunerstudio/mazduino-iox.ini "$pkg/tunerstudio/"
          zip -r "$pkg.zip" "$pkg"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            can-io-extender-*.zip
            out/*.hex
            tunerstudio/mazduino-iox.ini
          generate_release_notes: true
