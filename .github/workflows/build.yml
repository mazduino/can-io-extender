name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crystal: ['8mhz', '16mhz']
        node: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        env:
          PLATFORMIO_BUILD_FLAGS: -D NODE_ID=${{ matrix.node }}
        run: |
          env=megaatmega2560
          if [ "${{ matrix.crystal }}" = "16mhz" ]; then env=megaatmega2560-16mhz; fi
          pio run -e "$env"
          mkdir -p out
          name="can-io-extender-${{ matrix.crystal }}-node${{ matrix.node }}"
          cp ".pio/build/$env/firmware.hex" "out/$name.hex"
          ~/.platformio/packages/toolchain-atmelavr/bin/avr-objcopy \
            -I ihex -O binary "out/$name.hex" "out/$name.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: can-io-extender-${{ matrix.crystal }}-node${{ matrix.node }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp TunerStudio signature
        run: python tools/ts_signature.py

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Zip
        env:
          AVRDUDE_VERSION: v8.3
        run: |
          pkg="can-io-extender-${GITHUB_REF_NAME}"
          sig=$(python tools/ts_signature.py)
          mkdir -p "$pkg/hex" "$pkg/bin" "$pkg/tunerstudio"
          cp out/*.hex "$pkg/hex/"
          cp out/*.bin "$pkg/bin/"
          cp tunerstudio/mazduino-iox.ini "$pkg/tunerstudio/"
          cp flash.bat flash.sh "$pkg/"
          cp flash.sh "$pkg/flash.command"
          chmod +x "$pkg/flash.sh" "$pkg/flash.command"
          sed -e "s/@VERSION@/${GITHUB_REF_NAME}/" -e "s/@SIGNATURE@/${sig}/" release/README.txt > "$pkg/README.txt"
          base="https://github.com/avrdudes/avrdude/releases/download/${AVRDUDE_VERSION}"
          tools="$pkg/tools/avrdude"
          mkdir -p "$tools/windows"
          curl -sSfL -o avrdude-win.zip "$base/avrdude-${AVRDUDE_VERSION}-windows-x64.zip"
          unzip -j avrdude-win.zip avrdude.exe avrdude.conf -d "$tools/windows"
          for p in macOS_64bit:macos Linux_64bit:linux-x64 Linux_ARM64:linux-arm64; do
            src=${p%%:*}; dst=${p##*:}
            curl -sSfL -o "av-$src.tar.gz" "$base/avrdude_${AVRDUDE_VERSION}_${src}.tar.gz"
            mkdir -p "$tools/$dst"
            tar -xzf "av-$src.tar.gz" -C "$tools/$dst" --strip-components=1
            chmod +x "$tools/$dst/bin/avrdude"
          done
          curl -sSfL -o "$tools/COPYING" "https://raw.githubusercontent.com/avrdudes/avrdude/${AVRDUDE_VERSION}/COPYING"
          echo "avrdude ${AVRDUDE_VERSION} (GPL-2.0), source: https://github.com/avrdudes/avrdude/releases/tag/${AVRDUDE_VERSION}" > "$tools/SOURCE.txt"
          zip -r -y "$pkg.zip" "$pkg"

      - uses: softprops/action-gh-release@v2
        with:
          files: can-io-extender-*.zip
          generate_release_notes: true

  ini-pages:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Place INI by signature
        run: |
          sig=$(python tools/ts_signature.py)
          path=$(python tools/ts_signature.py --path)
          mkdir -p "site/ini/$(dirname "$path")"
          cp tunerstudio/mazduino-iox.ini "site/ini/$path"
          cp tunerstudio/mazduino-iox.ini site/ini/latest.ini
          echo "$sig" > site/ini/latest.txt
          echo "Published https://mazduino.github.io/can-io-extender/ini/$path" >> "$GITHUB_STEP_SUMMARY"

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          commit_message: "INI ${{ github.sha }}"
