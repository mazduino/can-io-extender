[Constants]
   endianness          = little
   nPages              = 2
   pageSize            = 340, 8
   pageIdentifier      = "\x00\x01", "\x00\x02"
   pageReadCommand     = "p%2i%2o%2c", "p%2i%2o%2c"
   pageValueWrite      = "M%2i%2o%2c%v", "M%2i%2o%2c%v"
   pageChunkWrite      = "M%2i%2o%2c%v", "M%2i%2o%2c%v"
   burnCommand         = "b%2i", "b%2i"
   blockingFactor      = 48
   delayAfterPortOpen  = 1500
   blockReadTimeout    = 2000
   tsWriteBlocks       = on
   interWriteDelay     = 10
   pageActivationDelay = 10

