[MegaTune]
   MTversion      = 2.25
   queryCommand   = "Q"
   signature      = "mazduino-iox 1"
   versionInfo    = "S"

[TunerStudio]
   iniSpecVersion = 3.64

[Constants]
   endianness          = little
   nPages              = 1
   pageSize            = 136
   pageIdentifier      = "\x00\x01"
   pageReadCommand     = "p%2i%2o%2c"
   pageValueWrite      = "M%2i%2o%2c%v"
   pageChunkWrite      = "M%2i%2o%2c%v"
   burnCommand         = "b%2i"
   blockingFactor      = 48
   delayAfterPortOpen  = 1500
   blockReadTimeout    = 2000
   tsWriteBlocks       = on
   interWriteDelay     = 10
   pageActivationDelay = 10

page = 1
   cal0_source = bits,   U08,   0, [0:3], "A0 (battery pin)", "A1", "A2", "A3", "A4", "A5", "A6", "A7", "A8", "A9", "A10", "INVALID", "INVALID", "INVALID", "INVALID", "Off"
   cal0_count  = scalar, U08,   1, "points", 1, 0, 0, 8, 0
   cal0_mv     = array,  U16,   2, [8], "mV", 1, 0, 0, 5000, 0
   cal0_value  = array,  S16,  18, [8], "",   1, 0, -32768, 32767, 0

   cal1_source = bits,   U08,  34, [0:3], "A0 (battery pin)", "A1", "A2", "A3", "A4", "A5", "A6", "A7", "A8", "A9", "A10", "INVALID", "INVALID", "INVALID", "INVALID", "Off"
   cal1_count  = scalar, U08,  35, "points", 1, 0, 0, 8, 0
   cal1_mv     = array,  U16,  36, [8], "mV", 1, 0, 0, 5000, 0
   cal1_value  = array,  S16,  52, [8], "",   1, 0, -32768, 32767, 0

   cal2_source = bits,   U08,  68, [0:3], "A0 (battery pin)", "A1", "A2", "A3", "A4", "A5", "A6", "A7", "A8", "A9", "A10", "INVALID", "INVALID", "INVALID", "INVALID", "Off"
   cal2_count  = scalar, U08,  69, "points", 1, 0, 0, 8, 0
   cal2_mv     = array,  U16,  70, [8], "mV", 1, 0, 0, 5000, 0
   cal2_value  = array,  S16,  86, [8], "",   1, 0, -32768, 32767, 0

   cal3_source = bits,   U08, 102, [0:3], "A0 (battery pin)", "A1", "A2", "A3", "A4", "A5", "A6", "A7", "A8", "A9", "A10", "INVALID", "INVALID", "INVALID", "INVALID", "Off"
   cal3_count  = scalar, U08, 103, "points", 1, 0, 0, 8, 0
   cal3_mv     = array,  U16, 104, [8], "mV", 1, 0, 0, 5000, 0
   cal3_value  = array,  S16, 120, [8], "",   1, 0, -32768, 32767, 0

[Menu]
   menuDialog = main
   menu = "&Calibration"
      subMenu = cal0Dialog, "Slot 1 (calibration frame byte 0-1)"
      subMenu = cal1Dialog, "Slot 2 (calibration frame byte 2-3)"
      subMenu = cal2Dialog, "Slot 3 (calibration frame byte 4-5)"
      subMenu = cal3Dialog, "Slot 4 (calibration frame byte 6-7)"

[UserDefined]
   dialog = cal0Settings, ""
      field = "Analog input",  cal0_source
      field = "Points used",   cal0_count
   dialog = cal0Dialog, "Calibration slot 1", yAxis
      panel = cal0Settings
      panel = cal0Curve

   dialog = cal1Settings, ""
      field = "Analog input",  cal1_source
      field = "Points used",   cal1_count
   dialog = cal1Dialog, "Calibration slot 2", yAxis
      panel = cal1Settings
      panel = cal1Curve

   dialog = cal2Settings, ""
      field = "Analog input",  cal2_source
      field = "Points used",   cal2_count
   dialog = cal2Dialog, "Calibration slot 3", yAxis
      panel = cal2Settings
      panel = cal2Curve

   dialog = cal3Settings, ""
      field = "Analog input",  cal3_source
      field = "Points used",   cal3_count
   dialog = cal3Dialog, "Calibration slot 4", yAxis
      panel = cal3Settings
      panel = cal3Curve

[CurveEditor]
   curve = cal0Curve, "Slot 1: input mV to value"
      columnLabel = "Input", "Value"
      xAxis       = 0, 5000, 6
      yAxis       = 0, 1000, 5
      xBins       = cal0_mv, cal0Mv
      yBins       = cal0_value
      gauge       = cal0Gauge

   curve = cal1Curve, "Slot 2: input mV to value"
      columnLabel = "Input", "Value"
      xAxis       = 0, 5000, 6
      yAxis       = 0, 1000, 5
      xBins       = cal1_mv, cal1Mv
      yBins       = cal1_value
      gauge       = cal1Gauge

   curve = cal2Curve, "Slot 3: input mV to value"
      columnLabel = "Input", "Value"
      xAxis       = 0, 5000, 6
      yAxis       = 0, 1000, 5
      xBins       = cal2_mv, cal2Mv
      yBins       = cal2_value
      gauge       = cal2Gauge

   curve = cal3Curve, "Slot 4: input mV to value"
      columnLabel = "Input", "Value"
      xAxis       = 0, 5000, 6
      yAxis       = 0, 1000, 5
      xBins       = cal3_mv, cal3Mv
      yBins       = cal3_value
      gauge       = cal3Gauge

[OutputChannels]
   ochGetCommand = "A"
   ochBlockSize  = 56

   vbatt     = scalar, U16,  0, "V",   0.001, 0
   av1       = scalar, U16,  2, "mV",  1, 0
   av2       = scalar, U16,  4, "mV",  1, 0
   av3       = scalar, U16,  6, "mV",  1, 0
   av4       = scalar, U16,  8, "mV",  1, 0
   av5       = scalar, U16, 10, "mV",  1, 0
   av6       = scalar, U16, 12, "mV",  1, 0
   av7       = scalar, U16, 14, "mV",  1, 0
   av8       = scalar, U16, 16, "mV",  1, 0
   av9       = scalar, U16, 18, "mV",  1, 0
   av10      = scalar, U16, 20, "mV",  1, 0
   hall1     = scalar, U16, 22, "Hz",  0.1, 0
   hall2     = scalar, U16, 24, "Hz",  0.1, 0
   hall3     = scalar, U16, 26, "Hz",  0.1, 0
   hall4     = scalar, U16, 28, "Hz",  0.1, 0
   sw1       = bits,   U08, 30, [0:0]
   sw2       = bits,   U08, 30, [1:1]
   sw3       = bits,   U08, 30, [2:2]
   sw4       = bits,   U08, 30, [3:3]
   hallIn1   = bits,   U08, 30, [4:4]
   hallIn2   = bits,   U08, 30, [5:5]
   hallIn3   = bits,   U08, 30, [6:6]
   hallIn4   = bits,   U08, 30, [7:7]
   hs1Fault  = bits,   U08, 31, [0:0]
   hs2Fault  = bits,   U08, 31, [1:1]
   outLc1    = bits,   U08, 32, [0:0]
   outLc2    = bits,   U08, 32, [1:1]
   outLc3    = bits,   U08, 32, [2:2]
   outLc4    = bits,   U08, 32, [3:3]
   outLc5    = bits,   U08, 32, [4:4]
   outLs1    = bits,   U08, 32, [5:5]
   outLs2    = bits,   U08, 32, [6:6]
   outHs1    = bits,   U08, 33, [0:0]
   outHs2    = bits,   U08, 33, [1:1]
   outLogic1 = bits,   U08, 33, [2:2]
   outLogic2 = bits,   U08, 33, [3:3]
   failsafe  = bits,   U08, 34, [0:0]
   busLocked = bits,   U08, 34, [1:1]
   nodeId    = bits,   U08, 35, [0:3]
   fwVersion = bits,   U08, 35, [4:7]
   cal0      = scalar, S16, 36, "",    1, 0
   cal1      = scalar, S16, 38, "",    1, 0
   cal2      = scalar, S16, 40, "",    1, 0
   cal3      = scalar, S16, 42, "",    1, 0
   cal0Mv    = scalar, U16, 44, "mV",  1, 0
   cal1Mv    = scalar, U16, 46, "mV",  1, 0
   cal2Mv    = scalar, U16, 48, "mV",  1, 0
   cal3Mv    = scalar, U16, 50, "mV",  1, 0
   secl      = scalar, U16, 52, "s",   1, 0
   busKbps   = scalar, U16, 54, "kbps", 1, 0

   time      = { timeNow }

[GaugeConfigurations]
   gaugeCategory = "Module"
   vbattGauge = vbatt,   "Battery",        "V",    0,  20,  10, 11, 15, 16, 1, 1
   busGauge   = busKbps, "CAN bitrate",    "kbps", 0, 1000, 0,  0, 1000, 1000, 0, 0
   uptimeGauge = secl,   "Uptime",         "s",    0, 65535, 0, 0, 65535, 65535, 0, 0

   gaugeCategory = "Analog inputs"
   av1Gauge  = av1,  "AV1",  "mV", 0, 5000, 0, 0, 5000, 5000, 0, 0
   av2Gauge  = av2,  "AV2",  "mV", 0, 5000, 0, 0, 5000, 5000, 0, 0
   av3Gauge  = av3,  "AV3",  "mV", 0, 5000, 0, 0, 5000, 5000, 0, 0
   av4Gauge  = av4,  "AV4",  "mV", 0, 5000, 0, 0, 5000, 5000, 0, 0
   av5Gauge  = av5,  "AV5",  "mV", 0, 5000, 0, 0, 5000, 5000, 0, 0
   av6Gauge  = av6,  "AV6",  "mV", 0, 5000, 0, 0, 5000, 5000, 0, 0
   av7Gauge  = av7,  "AV7",  "mV", 0, 5000, 0, 0, 5000, 5000, 0, 0
   av8Gauge  = av8,  "AV8",  "mV", 0, 5000, 0, 0, 5000, 5000, 0, 0
   av9Gauge  = av9,  "AV9",  "mV", 0, 5000, 0, 0, 5000, 5000, 0, 0
   av10Gauge = av10, "AV10", "mV", 0, 5000, 0, 0, 5000, 5000, 0, 0

   gaugeCategory = "Frequency inputs"
   hall1Gauge = hall1, "HALL1", "Hz", 0, 2000, 0, 0, 2000, 2000, 1, 1
   hall2Gauge = hall2, "HALL2", "Hz", 0, 2000, 0, 0, 2000, 2000, 1, 1
   hall3Gauge = hall3, "HALL3", "Hz", 0, 2000, 0, 0, 2000, 2000, 1, 1
   hall4Gauge = hall4, "HALL4", "Hz", 0, 2000, 0, 0, 2000, 2000, 1, 1

   gaugeCategory = "Calibrated values"
   cal0Gauge = cal0, "Slot 1", "", -32768, 32767, -32768, -32768, 32767, 32767, 0, 0
   cal1Gauge = cal1, "Slot 2", "", -32768, 32767, -32768, -32768, 32767, 32767, 0, 0
   cal2Gauge = cal2, "Slot 3", "", -32768, 32767, -32768, -32768, 32767, 32767, 0, 0
   cal3Gauge = cal3, "Slot 4", "", -32768, 32767, -32768, -32768, 32767, 32767, 0, 0

[FrontPage]
   gauge1 = vbattGauge
   gauge2 = av1Gauge
   gauge3 = av2Gauge
   gauge4 = hall1Gauge
   gauge5 = cal0Gauge
   gauge6 = cal1Gauge
   gauge7 = cal2Gauge
   gauge8 = cal3Gauge

   indicator = { busLocked }, "CAN searching", "CAN locked", white, black, green,  black
   indicator = { failsafe  }, "Outputs live",  "Failsafe",   white, black, yellow, black
   indicator = { sw1       }, "SW1",           "SW1",        white, black, green,  black
   indicator = { sw2       }, "SW2",           "SW2",        white, black, green,  black
   indicator = { sw3       }, "SW3",           "SW3",        white, black, green,  black
   indicator = { sw4       }, "SW4",           "SW4",        white, black, green,  black
   indicator = { hs1Fault  }, "HS1 OK",        "HS1 fault",  white, black, red,    black
   indicator = { hs2Fault  }, "HS2 OK",        "HS2 fault",  white, black, red,    black

[Datalog]
   entry = time,    "Time",    float, "%.3f"
   entry = vbatt,   "Battery", float, "%.2f"
   entry = av1,     "AV1",     int,   "%d"
   entry = av2,     "AV2",     int,   "%d"
   entry = av3,     "AV3",     int,   "%d"
   entry = av4,     "AV4",     int,   "%d"
   entry = av5,     "AV5",     int,   "%d"
   entry = av6,     "AV6",     int,   "%d"
   entry = av7,     "AV7",     int,   "%d"
   entry = av8,     "AV8",     int,   "%d"
   entry = av9,     "AV9",     int,   "%d"
   entry = av10,    "AV10",    int,   "%d"
   entry = hall1,   "HALL1",   float, "%.1f"
   entry = hall2,   "HALL2",   float, "%.1f"
   entry = hall3,   "HALL3",   float, "%.1f"
   entry = hall4,   "HALL4",   float, "%.1f"
   entry = cal0,    "Slot1",   int,   "%d"
   entry = cal1,    "Slot2",   int,   "%d"
   entry = cal2,    "Slot3",   int,   "%d"
   entry = cal3,    "Slot4",   int,   "%d"
   entry = failsafe, "Failsafe", int, "%d"
   entry = busLocked, "BusLocked", int, "%d"
