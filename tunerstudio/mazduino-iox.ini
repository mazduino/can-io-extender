[SettingContextHelp]
   node = "Each module on the same CAN bus needs its own node number. Node 0 uses CAN IDs 0x640-0x64F, node 1 0x650-0x65F, node 2 0x660-0x66F, node 3 0x670-0x67F. Applies at once; Burn to keep it after power off."
   monitorId = "CAN ID to watch in the CAN monitor, typed in decimal because TunerStudio has no hex entry: 0x643 = 1603, 0x360 = 864, 0x5F0 = 1520. The gauge title shows it back in hex so you can check. 11-bit IDs only. Only used for the monitor; Burn to keep it."
   canBitrate = "Auto listens to the bus and locks onto its bitrate (500, 250 or 125 kbps, plus 1 Mbps on a 16 MHz crystal build). A fixed bitrate starts sending straight away without listening, so only pick one that matches the bus."
   sens0_name = "Your name for AV1, for example Fuel level. Used as the gauge title. Stored in this TunerStudio project only."
   cal0_mv = "Input voltage at each calibration point, lowest first. Rows stop counting at the first one that is not higher than the row above, and at least 2 rows are needed. Leave the whole curve at zero if AV1 needs no calibration."
   cal0_value = "The value at each voltage, in the unit and decimals chosen on the left. Between rows the value follows a straight line; below the first row and above the last it is held."
   sens0_dec = "Decimal places. The value is sent on CAN as a whole number: with 1 decimal, 62.5 goes out as 625, so set scale 0.1 on the dash (0.01 for 2 decimals). CAN 0x645 bytes 0-1 on node 0, signed 16-bit."
   sens0_unit = "Unit shown on the gauge and the curve. Display only; it is not sent anywhere."
   sens0_min = "Lowest value on the gauge and the curve. Display only."
