[UserDefined]
   dialog = out0Dialog, "Output LC1"
      topicHelp = "https://wiki.mazduino.com/can-io-extender/"
      field = "Mode",            out0_mode
      field = "#Condition 1"
      field = "Source",          out0_src1,  { out0_mode != 0 }
      field = "Comparison",      out0_cmp1,  { out0_mode != 0 && out0_src1 != 0 }
      field = "Target",          out0_tgt1,  { out0_mode != 0 && out0_src1 != 0 }
      field = "Hysteresis",      out0_hyst1, { out0_mode != 0 && out0_src1 != 0 && out0_cmp1 < 4 }
      field = "#Condition 2"
