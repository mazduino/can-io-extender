[OutputChannels]
   ochGetCommand = "A"
   ochBlockSize  = 68

   vbatt     = scalar, U16,  0, "V",   0.001, 0
   av1      = scalar, U16,  2, "V",   0.001, 0
   av2      = scalar, U16,  4, "V",   0.001, 0
   av3      = scalar, U16,  6, "V",   0.001, 0
   av4      = scalar, U16,  8, "V",   0.001, 0
   av5      = scalar, U16, 10, "V",   0.001, 0
   av6      = scalar, U16, 12, "V",   0.001, 0
   av7      = scalar, U16, 14, "V",   0.001, 0
   av8      = scalar, U16, 16, "V",   0.001, 0
   av9      = scalar, U16, 18, "V",   0.001, 0
   av10     = scalar, U16, 20, "V",   0.001, 0
   hall1    = scalar, U16, 22, "Hz",  0.1, 0
   hall2    = scalar, U16, 24, "Hz",  0.1, 0
   hall3    = scalar, U16, 26, "Hz",  0.1, 0
   hall4    = scalar, U16, 28, "Hz",  0.1, 0
   sw1      = bits,   U08, 30, [0:0]
   sw2      = bits,   U08, 30, [1:1]
   sw3      = bits,   U08, 30, [2:2]
   sw4      = bits,   U08, 30, [3:3]
   hallIn1  = bits,   U08, 30, [4:4]
   hallIn2  = bits,   U08, 30, [5:5]
   hallIn3  = bits,   U08, 30, [6:6]
   hallIn4  = bits,   U08, 30, [7:7]
   hs1Fault  = bits,   U08, 31, [0:0]
   hs2Fault  = bits,   U08, 31, [1:1]
   outLc1    = bits,   U08, 32, [0:0]
   outLc2    = bits,   U08, 32, [1:1]
   outLc3    = bits,   U08, 32, [2:2]
   outLc4    = bits,   U08, 32, [3:3]
   outLc5    = bits,   U08, 32, [4:4]
   outLs1    = bits,   U08, 32, [5:5]
   outLs2    = bits,   U08, 32, [6:6]
   outHs1    = bits,   U08, 33, [0:0]
   outHs2    = bits,   U08, 33, [1:1]
   outLogic1 = bits,   U08, 33, [2:2]
   outLogic2 = bits,   U08, 33, [3:3]
   failsafe  = bits,   U08, 34, [0:0]
   busLocked = bits,   U08, 34, [1:1]
   crystal16 = bits,   U08, 34, [2:2]
   canChip   = bits,   U08, 34, [3:3]
   canFixed  = bits,   U08, 34, [4:4]
   nodeId    = bits,   U08, 35, [0:3]
   fwVersion = bits,   U08, 35, [4:7]
   cal0      = scalar, S16, 36, "",    1, 0
   cal1      = scalar, S16, 38, "",    1, 0
   cal2      = scalar, S16, 40, "",    1, 0
   cal3      = scalar, S16, 42, "",    1, 0
   cal4      = scalar, S16, 44, "",    1, 0
   cal5      = scalar, S16, 46, "",    1, 0
   cal6      = scalar, S16, 48, "",    1, 0
   cal7      = scalar, S16, 50, "",    1, 0
   cal8      = scalar, S16, 52, "",    1, 0
   cal9      = scalar, S16, 54, "",    1, 0
   uptime    = scalar, U16, 56, "s",   1, 0
   busKbps   = scalar, U16, 58, "kbps", 1, 0
   canRxRate = scalar, U16, 60, "frames/s", 1, 0
   canTxRate = scalar, U16, 62, "frames/s", 1, 0
   canRec    = scalar, U08, 64, "",    1, 0
   canTec    = scalar, U08, 65, "",    1, 0
   canTxFail = scalar, U16, 66, "",    1, 0

   sens0     = { cal0 * (sens0_dec == 0 ? 1 : (sens0_dec == 1 ? 0.1 : 0.01)) }
   sens1     = { cal1 * (sens1_dec == 0 ? 1 : (sens1_dec == 1 ? 0.1 : 0.01)) }
