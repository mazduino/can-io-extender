   out0_mode = "CAN: LC1 follows the dash's CAN Buttons (0x648), and goes off 500 ms after the dash stops sending. Rule: the module switches LC1 by itself from the conditions below, with or without a dash. CAN or Rule: either one turns it on."
   out0_src1 = "What the condition watches. AV1-AV10 are calibrated values in the units of their curve, Raw AV in volts, HALL in rpm, km/h or Hz as set under HALL inputs, SW1-SW4 are 1 when active, Battery in volts."
   out0_tgt1 = "The value the source is compared against, in the source's own units."
   out0_hyst1 = "Keeps the output from chattering around the target. With > the output stays on until the source falls below Target minus Hysteresis; with < until it rises above Target plus Hysteresis. Example: fan on above 95, off below 90 = Target 95, Hysteresis 5."
   out0_logic = "Add a second condition. AND needs both, OR needs either."
   out0_delay = "How long the conditions must hold before LC1 turns on. It turns off without delay."
