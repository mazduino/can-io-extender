[UserDefined]
   dialog = moduleDialog, "Node and CAN bus"
      topicHelp = "https://wiki.mazduino.com/can-io-extender/"
      field = "#Node"
      field = "Node number", node
      field = "Each module on the same bus needs its own node number."
      field = "The node picks the module's CAN ID block (node 0 = 0x640-0x64F)."
      field = "#CAN bus"
      field = "Bitrate", canBitrate
      field = "Auto listens and locks onto the bus bitrate by itself."
      field = "A fixed bitrate starts sending straight away, so only pick one"
      field = "that matches the bus. 1 Mbps needs the 16 MHz crystal build."
      field = "Changes apply at once; Burn to keep them after power off."

   dialog = sens0Settings, ""
      field = "Name",          sens0_name
      field = "Decimals",      sens0_dec
      field = "Unit",          sens0_unit
      field = "Gauge minimum", sens0_min
      field = "Gauge maximum", sens0_max
      field = ""
