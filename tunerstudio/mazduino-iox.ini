   hall0_fn = "What HALL1 measures. RPM: engine speed from a tach, ignition or trigger signal. Speed (VSS): road speed from a vehicle speed sensor or wheel/driveshaft teeth. Frequency: the raw pulse rate in Hz, for anything else (flex fuel sensor, flow meter)."
   hall0_ppkm = "Pulses per kilometre from the speed sensor. Work it out as sensor pulses per wheel turn x 1000 / tyre circumference in metres, or drive a measured kilometre and count. A typical gearbox VSS is a few thousand."
   hall0_signal = "Tach / ignition: one pulse per spark, as from an ECU tach output or a tach adapter on the coil. RPM is worked out from the cylinder count. Custom: enter the pulses per crank revolution yourself, for a trigger wheel or an unusual tach output."
   hall0_cyl = "Number of cylinders. A 4-stroke engine sparks every other revolution, so a 4-cylinder gives 2 pulses per revolution and a single cylinder 0.5. Count only the cylinders the signal sees: a tach adapter on one coil of a coil-on-plug engine sees 1, on one wasted-spark coil 2."
   hall0_stroke = "4-stroke for nearly every car and most motorcycles. 2-stroke fires every revolution, doubling the pulses."
   hall0_ppr = "Pulses per crank revolution, used when Signal is Custom. Trigger wheel: number of teeth that are present (60-2 = 58). A tach output that pulses once per revolution: 1."
   hall0_filter = "Ignores a pulse that comes sooner than this share of the previous gap, which removes the double pulses a tach adapter or coil signal can ring with. Lite suits most signals; use Off for very fast or uneven wheels."
   hall0_smooth = "Averages the reading. Higher is steadier but slower to follow quick changes; 0 shows every reading as measured."
