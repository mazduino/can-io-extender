   out10_hyst1 = "Keeps the output from chattering around the target. With > the output stays on until the source falls below Target minus Hysteresis; with < until it rises above Target plus Hysteresis. Example: fan on above 95, off below 90 = Target 95, Hysteresis 5."
   out10_logic = "Add a second condition. AND needs both, OR needs either."
   out10_delay = "How long the conditions must hold before LOGIC2 turns on. It turns off without delay."
   testEnable = "Takes over every output while on, ignoring CAN and rules. Switches off by itself when TunerStudio stops talking for 2 s."

